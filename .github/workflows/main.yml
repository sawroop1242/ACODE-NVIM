name: Build Acode APK with Patches

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out current repository (contains patches/)
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          path: main-repo

      # Step 2: Clone the official Acode repository
      - name: Clone Acode Repository
        run: |
          git clone https://github.com/deadlyjack/Acode.git acode

      # Step 3: Set up Java JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Set up Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 5: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: acode/package-lock.json

      # Step 6: Apply patch files from main-repo onto Acode
      - name: Apply Patch Files
        run: |
          cd acode
          if [ -d "../main-repo/patches" ]; then
            for patch in ../main-repo/patches/*.patch; do
              [ -e "$patch" ] || continue
              echo "Applying patch: $patch..."
              git apply --forward "$patch" || echo "Skipped $patch (already applied or conflict)"
            done
          else
            echo "No patches folder found at main-repo/patches"
          fi

      # Step 7: Install Dependencies
      - name: Install Dependencies
        working-directory: acode
        run: npm ci || npm install

      # Step 8: Initialize Cordova Android Platform (moved before build script)
      - name: Add Cordova Android Platform
        working-directory: acode
        run: npx cordova platform add android --nosave || true

      # Step 9: Build Acode Web Assets & Trigger Build Script
      - name: Build Web Assets
        working-directory: acode
        run: npm run build

      # Step 10: Compile Android APK via Cordova
      - name: Build Android APK
        working-directory: acode
        run: npx cordova build android --release --device

      # Step 11: Upload Generated APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acode-apk
          path: acode/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
